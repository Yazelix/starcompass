[package]
name = "starcompass"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Canonical, composable development protocols for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yazelix/starcompass"
homepage = "https://github.com/Yazelix/starcompass"
readme = "README.md"
exclude = [".beads/"]
publish = false
autolib = false

[dependencies]
atomic-write-file = "=0.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
